<title>Eletrônica I – Materiais interativos</title>
<style>
:root{--bg:#eef2f6;--fg:#152030;--muted:#566275;--accent:#1c4f9e;--surface:#fff;--line:#d3dbe5}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:720px;margin:0 auto}
.eyebrow{font:12px ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{color:var(--accent);font-size:18px}

</style>

<main>
<div class="eyebrow">UFSM00053 · Universidade Federal de Santa Maria</div>
<h1>Eletrônica I – Materiais interativos</h1>
